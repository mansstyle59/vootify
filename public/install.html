<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Installer Vootify sur iPhone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0b0e14;
      color: #fff;
      font-family: -apple-system, 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111622;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-install {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
      transition: opacity 0.2s;
    }
    .btn-install:active { opacity: 0.85; }
    .note {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      border-radius: 8px;
      padding: 8px 14px;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="pwa-icon-192.png" alt="Vootify logo" />
    <h1>Vootify</h1>
    <p>Musique &amp; radio en streaming.<br>Installez l'app directement sur votre iPhone.</p>

    <a class="btn-install"
       href="itms-services://?action=download-manifest&amp;url=https://mansstyle59.github.io/vootify/manifest.plist">
      📲 Installer sur iPhone
    </a>

    <div class="note">
      Appuyez sur le bouton depuis <strong>Safari</strong> sur votre iPhone.<br>
      iOS vous demandera de confirmer l'installation.
    </div>

    <div class="badge">
      <span>📦</span>
      <span>Version 1.0 · app.lovable.vootify</span>
    </div>
  </div>
</body>
</html>
