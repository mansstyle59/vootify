name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

env:
  APP_NAME: Vootify
  BUNDLE_ID: com.vootify.app

jobs:
  deploy-testflight:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare iOS platform
        run: |
          if [ -d "ios" ] && [ ! -f "ios/App/Podfile" ]; then
            rm -rf ios
          fi
          npx cap add ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Generate iOS app icon
        run: |
          mkdir -p assets
          curl -L "https://github.com/user-attachments/assets/8f70a951-fdb6-47bd-9487-049612b342cc" -o assets/icon-only.png
          npx capacitor-assets generate --ios

      # ---------------------------------------------------------------------------
      # Code signing
      #
      # Required GitHub secrets:
      #   APPLE_DISTRIBUTION_CERTIFICATE_P12  – base64-encoded .p12 distribution cert
      #   APPLE_CERTIFICATE_PASSWORD          – password for the .p12 file
      #   PROVISIONING_PROFILE_BASE64         – base64-encoded .mobileprovision profile
      # ---------------------------------------------------------------------------
      - name: Install Apple distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          rm -f "$PP_PATH"

      - name: Build and archive signed .ipa
        working-directory: ios/App
        run: |
          # Resolve workspace or project flag
          if [ -d "App.xcworkspace" ]; then
            XCODE_PROJECT_FLAG="-workspace App.xcworkspace"
          else
            XCODE_PROJECT_FLAG="-project App.xcodeproj"
          fi

          # Determine provisioning profile name from installed profile
          PP_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< \
            $(security cms -D -i "$PP_PATH"))

          # Archive
          xcodebuild archive \
            $XCODE_PROJECT_FLAG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            PROVISIONING_PROFILE_SPECIFIER="$PP_NAME" \
            CODE_SIGN_STYLE=Manual

          # Export options plist
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PP_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          # Export .ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # ---------------------------------------------------------------------------
      # TestFlight upload
      #
      # Required GitHub secrets:
      #   APP_STORE_CONNECT_API_KEY_ID      – Key ID from App Store Connect
      #   APP_STORE_CONNECT_API_ISSUER_ID   – Issuer ID from App Store Connect
      #   APP_STORE_CONNECT_API_KEY_CONTENT – base64-encoded .p8 API key file
      # ---------------------------------------------------------------------------
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/${{ env.APP_NAME }}.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed
          path: ${{ runner.temp }}/export/*.ipa
