name: Build iOS .ipa

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare iOS platform
        run: |
          if [ -d "ios" ] && [ ! -f "ios/App/Podfile" ]; then
            rm -rf ios
          fi
          npx cap add ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild build \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath $RUNNER_TEMP/build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          else
            xcodebuild build \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath $RUNNER_TEMP/build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS=""
          fi

      - name: Package .ipa
        run: |
          APP_PATH=$(find $RUNNER_TEMP/build -name "*.app" -type d | head -1)
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP && zip -r Vootify-unsigned.ipa Payload/

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Vootify-unsigned
          path: ${{ runner.temp }}/Vootify-unsigned.ipa
