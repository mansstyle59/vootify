name: Build & Release iOS .ipa

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare iOS platform
        run: |
          if [ -d "ios" ] && [ ! -f "ios/App/Podfile" ]; then
            rm -rf ios
          fi
          npx cap add ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Sync Capacitor
        run: npx cap sync ios

      # ── Signed build (ad-hoc) ──────────────────────────────────────────────
      # Requires three repository secrets:
      #   IOS_CERTIFICATE_P12_BASE64   – base64-encoded .p12 distribution cert
      #   IOS_CERTIFICATE_PASSWORD     – password for the .p12
      #   IOS_PROVISIONING_PROFILE_BASE64 – base64-encoded ad-hoc .mobileprovision
      - name: Import signing certificate
        if: ${{ env.IOS_CERTIFICATE_P12_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: ${{ env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/vootify.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      # ── Signed export (ad-hoc) ─────────────────────────────────────────────
      - name: Archive & export signed .ipa
        if: ${{ env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        working-directory: ios/App
        run: |
          WORKSPACE=$([ -d App.xcworkspace ] && echo "App.xcworkspace" || echo "App.xcodeproj")
          FLAG=$([ "$WORKSPACE" = "App.xcworkspace" ] && echo "-workspace" || echo "-project")

          xcodebuild archive \
            $FLAG "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Vootify.xcarchive

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Vootify.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

          cp $RUNNER_TEMP/export/*.ipa $RUNNER_TEMP/Vootify.ipa

      # ── Unsigned fallback ──────────────────────────────────────────────────
      - name: Build unsigned .app (fallback)
        if: ${{ env.IOS_CERTIFICATE_P12_BASE64 == '' || env.IOS_PROVISIONING_PROFILE_BASE64 == '' }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        working-directory: ios/App
        run: |
          WORKSPACE=$([ -d App.xcworkspace ] && echo "App.xcworkspace" || echo "App.xcodeproj")
          FLAG=$([ "$WORKSPACE" = "App.xcworkspace" ] && echo "-workspace" || echo "-project")

          xcodebuild build \
            $FLAG "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $RUNNER_TEMP/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

          APP_PATH=$(find $RUNNER_TEMP/build -name "*.app" -type d | head -1)
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP && zip -r Vootify.ipa Payload/

      # ── Publish to GitHub Releases ─────────────────────────────────────────
      - name: Determine version tag
        id: version
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V="$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "name=Vootify $V" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## 📲 Install on iPhone (OTA)

            Open **https://mansstyle59.github.io/vootify/install.html** on your iPhone and tap **Installer sur iPhone**.

            > ⚠️ Ad-hoc build: your device UDID must be registered in the provisioning profile.
          files: ${{ runner.temp }}/Vootify.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Keep artifact for manual download too ─────────────────────────────
      - name: Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vootify-ipa
          path: ${{ runner.temp }}/Vootify.ipa

