<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VOOTIFY</title>
    <meta name="description" content="VOOTIFY - Votre application de musique et radio en streaming.">
    <meta name="author" content="Vootify" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA -->
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vootify" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="apple-touch-startup-image" href="/splash-screen.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Preconnect for critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://whjjlqznrwroiwrpmoum.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://c.saavncdn.com" />
    <link rel="dns-prefetch" href="https://cdns-images.dzcdn.net" />

    <!-- Preload font CSS for faster text rendering -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" /></noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VOOTIFY" />
    <meta property="og:description" content="VOOTIFY - Votre application de musique et radio en streaming." />
    <meta property="og:image" content="/pwa-icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VOOTIFY" />
    <meta name="twitter:description" content="VOOTIFY - Votre application de musique et radio en streaming." />
    <meta name="twitter:image" content="/pwa-icon-512.png" />
  </head>

  <body>
    <div id="root">
      <!-- Inline skeleton to eliminate white flash before React hydrates -->
      <div style="min-height:100vh;background:#0b0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
        <img src="/pwa-icon-192.png" alt="" width="96" height="96" style="border-radius:28px;box-shadow:0 0 40px rgba(34,197,94,.2)" />
        <div style="display:flex;gap:3px">
          <span style="color:#22c55e;font-size:28px;font-weight:900;letter-spacing:0.16em;font-family:system-ui">VOOTIFY</span>
        </div>
        <div style="width:80px;height:3px;border-radius:4px;background:#1a1f2e;overflow:hidden;margin-top:8px">
          <div style="width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,transparent,rgba(34,197,94,.6),transparent);animation:slide 1.2s ease-in-out infinite"></div>
        </div>
      </div>
      <style>@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
