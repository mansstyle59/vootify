<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VOOTIFY</title>
    <meta name="description" content="VOOTIFY - Votre application de musique et radio en streaming.">
    <meta name="author" content="Vootify" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA -->
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vootify" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Preconnect for critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://whjjlqznrwroiwrpmoum.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://c.saavncdn.com" />
    <link rel="dns-prefetch" href="https://cdns-images.dzcdn.net" />

    <!-- Preload font CSS for faster text rendering -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" /></noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VOOTIFY" />
    <meta property="og:description" content="VOOTIFY - Votre application de musique et radio en streaming." />
    <meta property="og:image" content="/pwa-icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VOOTIFY" />
    <meta name="twitter:description" content="VOOTIFY - Votre application de musique et radio en streaming." />
    <meta name="twitter:image" content="/pwa-icon-512.png" />
  </head>

  <body>
    <div id="root">
      <div aria-hidden="true" style="min-height:100vh;background:hsl(222 30% 7%)"></div>
    </div>
    <script>
      (() => {
        const RECOVERY_KEY = "vootify-inline-boot-recovery";
        const RECOVERY_COOLDOWN = 15000;

        setTimeout(async () => {
          if (document.documentElement.dataset.appMounted === "true") return;

          const isPreviewHost =
            window.location.hostname.includes("id-preview--") ||
            window.location.hostname.includes(".lovableproject.com");

          if (isPreviewHost || !("serviceWorker" in navigator)) return;

          const lastRecovery = Number(sessionStorage.getItem(RECOVERY_KEY) || 0);
          if (Date.now() - lastRecovery < RECOVERY_COOLDOWN) return;

          sessionStorage.setItem(RECOVERY_KEY, String(Date.now()));

          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ("caches" in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }
          } catch {}

          window.location.reload();
        }, 1800);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
